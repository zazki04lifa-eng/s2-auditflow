<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AuditFlow AI - Automated Audit Flowchart Generator</title>
  <meta name="description" content="AI-powered audit flowchart generator for automated business process analysis">

  <!-- Favicon -->
  <link rel="icon" type="image/svg+xml"
    href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='grad' x1='0%25' y1='0%25' x2='100%25' y2='100%25'%3E%3Cstop offset='0%25' style='stop-color:%236366f1'/%3E%3Cstop offset='100%25' style='stop-color:%238b5cf6'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='12' fill='url(%23grad)'/%3E%3Cpath d='M20 20h8v8h-8z M36 20h8v8h-8z M20 36h8v8h-8z M36 36h8v8h-8z' fill='white'/%3E%3C/svg%3E">
</head>

<body>
  <div class="app-shell">
    <!-- Sidebar Backdrop -->
    <div class="sidebar-backdrop" id="sidebarBackdrop"></div>

    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <div class="mark">
          <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <defs>
              <linearGradient id="auditflow-grad" x1="0%" y1="0%" x2="100%" y2="100%">
                <stop offset="0%" stop-color="#72d6ff" />
                <stop offset="100%" stop-color="#4f8fff" />
              </linearGradient>
            </defs>
            <circle cx="28" cy="28" r="20" fill="url(#auditflow-grad)" />
            <path d="M18 38 L33 22" stroke="#0a1628" stroke-width="6" stroke-linecap="round" />
            <path d="M40 46 L54 60" stroke="#0a1628" stroke-width="6" stroke-linecap="round" />
            <circle cx="28" cy="28" r="14" fill="#fff" />
            <circle cx="24" cy="24" r="3" fill="#0a1628" />
            <circle cx="34" cy="24" r="3" fill="#0a1628" />
            <path d="M22 34c4 4 10 4 14 0" stroke="#0a1628" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M18 18c1-3 5-4 7-2" stroke="#0a1628" stroke-width="2.5" fill="none" stroke-linecap="round" />
            <path d="M17 13c2-1 5 0 6 2" stroke="#0a1628" stroke-width="2" fill="none" stroke-linecap="round" />
            <circle cx="16" cy="12" r="2" fill="#ffd166" />
            <path d="M42 18l4-4l4 4" stroke="#ffd166" stroke-width="3" fill="none" stroke-linecap="round" />
            <path d="M48 18l2-6" stroke="#ffd166" stroke-width="3" fill="none" stroke-linecap="round" />
          </svg>
        </div>
        <div>
          <div class="name">AuditFlow AI</div>
          <div class="tag">AUDIT PLANNING ASSISTANT</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <div class="nav-group-label">Menu Utama</div>
        <button class="nav-item active" data-nav="dashboard">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="3" width="7" height="9" rx="1.5" />
            <rect x="14" y="3" width="7" height="5" rx="1.5" />
            <rect x="14" y="12" width="7" height="9" rx="1.5" />
            <rect x="3" y="16" width="7" height="5" rx="1.5" />
          </svg>
          Dashboard
        </button>
        <button class="nav-item" data-nav="new">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 5v14M5 12h14" />
          </svg>
          New Project
        </button>
        <button class="nav-item" data-nav="projects">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z" />
          </svg>
          My Projects
        </button>
        <button class="nav-item" data-nav="settings">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3" />
            <path
              d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.7 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.6a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1Z" />
          </svg>
          Settings
        </button>
      </nav>

      <div class="sidebar-foot">AuditFlow AI · Free Edition<br>Semua data tersimpan lokal di device kamu.</div>
    </aside>

    <!-- Main Area -->
    <div class="main-area">
      <header class="topbar">
        <div style="display:flex; align-items:center; gap:12px;">
          <button class="menu-toggle btn-icon" id="menuToggle">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 6h18M3 12h18M3 18h18" />
            </svg>
          </button>
          <button class="btn-back btn-icon" id="btnBack" style="display:none;" title="Kembali" aria-label="Kembali">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
          </button>
          <div>
            <nav class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb">
              <span class="breadcrumb-item">Dashboard</span>
            </nav>
            <div class="topbar-title" id="topbarTitle">Dashboard</div>
            <div class="topbar-sub" id="topbarSub">Ringkasan aktivitas audit planning kamu</div>
          </div>
        </div>
        <div class="topbar-right">
          <button class="btn btn-primary btn-sm" data-nav="new">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14M5 12h14" />
            </svg>
            Project Baru
          </button>
          <div class="avatar" id="userAvatar" style="cursor:pointer;" title="Account">A</div>
        </div>
      </header>

      <main class="content">
        <!-- Dashboard View -->
        <section class="view active" id="view-dashboard">
          <div id="dashboard-container"></div>
        </section>

        <!-- New Project View -->
        <section class="view" id="view-new-project" style="display:none;">
          <div id="new-project-container"></div>
          <div id="input-container"></div>
        </section>

        <!-- Projects View -->
        <section class="view" id="view-projects" style="display:none;">
          <div id="projects-container"></div>
        </section>

        <!-- Workspace View (for active project work) -->
        <section class="view" id="view-workspace" style="display:none;">
          <div id="workspace-container">
            <div id="flowchart-container"></div>
            <div id="flowchart-body"></div>
          </div>
        </section>

        <!-- Settings View -->
        <section class="view" id="view-settings" style="display:none;">
          <div id="settings-container"></div>
        </section>

        <!-- Export View -->
        <section class="view" id="view-export" style="display:none;">
          <div id="export-container"></div>
        </section>
      </main>
    </div>

    <!-- AI Assistant Panel -->
    <div id="ai-assistant-container"></div>
  </div>

  <!-- Toast Container -->
  <div id="toast-container" aria-live="polite"></div>

  <!-- Loading Overlay -->
  <div id="loading-overlay" class="loading-overlay" style="display:none;">
    <div class="loading-spinner"></div>
    <div class="loading-text">Memproses...</div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
